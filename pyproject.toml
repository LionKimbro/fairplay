[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fairplay"
version = "0.1.0"
description = "Cooperative filesystem-write coordination through immutable JSON claims."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["machine-root"]
license = { file = "LICENSE" }

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
